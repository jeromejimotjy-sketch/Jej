
name: Build Vector Fabric mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'Vector-Fabric-1.21.1-project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q Vector-Fabric-1.21.1-project.zip -d project
          find project -name build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build mod
        run: |
          ROOT="$(find "$GITHUB_WORKSPACE/project" -name build.gradle -print -quit)"
          test -n "$ROOT"
          cd "$(dirname "$ROOT")"
          gradle build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Vector-Minecraft-1.21.1
          path: project/**/build/libs/*.jar
          if-no-files-found: error
