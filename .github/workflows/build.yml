name: Build Vector Fabric Mod

on:
  workflow_dispatch:
  push:
    paths:
      - "Vector-Modules-Source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract Vector source
        run: |
          set -e
          mkdir -p project
          unzip -
