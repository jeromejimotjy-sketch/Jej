
name: Build Vector Fabric Mod

on:
  workflow_dispatch:
  push:
    paths:
      - "Vector-Modules-Source-Updated3.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle
        run: |
          set -e
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: |
          set -e
          mkdir -p project
          unzip -q Vector-Modules-Source.zip -d project
          find project -type f | head -100

      - name: Find Gradle project
        run: |
          set -e
          BUILD_FILE=$(find project -type f \( -name build.gradle -o -name build.gradle.kts \) | head -1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No Gradle build file found."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Build mod
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle --no-daemon build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Vector-Minecraft-1.21.1
          path: project/**/build/libs/*.jar
          if-no-files-found: error
